#
# One-command bench: ChirpStack (US915) + Leftenant + a standalone events store.
#
#   cp .env.example .env && docker compose up -d --build
#
# A one-shot `provisioner` runs after ChirpStack is up, creates the
# "Intelligent Farming" tenant + a tenant API key, and writes the connection
# artifacts to the `shared` volume. Leftenant boots already configured with that
# key.
#
# Device events are stored by ChirpStack's own PostgreSQL integration: ChirpStack
# writes every event (uplinks, joins, acks, status, …) straight into `events-postgres`,
# auto-creating its `event_*` tables on first boot. `events-api` (PostGraphile) serves a
# read-only GraphQL/GraphiQL endpoint over them. No separate collector; nothing here
# depends on the intelligent-farming-hub repo.
#
# Leftenant runs an image built from its public repo (github.com/intelligent-farming/leftenant,
# main) by the setup scripts via `docker build <giturl>` — no local clone, and no compose git-URL
# build context (that one breaks on Windows). Everything else uses published images or builds in-repo.
name: intelligent-farming-stack

services:
  # ── ChirpStack core ────────────────────────────────────────────────────────
  chirpstack-postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chirpstack
      POSTGRES_PASSWORD: chirpstack
      POSTGRES_DB: chirpstack
    volumes:
      - ./postgresql/initdb:/docker-entrypoint-initdb.d:ro
      - chirpstack-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chirpstack -d chirpstack"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 300 1 --save 60 100 --appendonly no
    volumes:
      - redisdata:/data

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "${MOSQUITTO_MQTT_PORT:-1883}:1883"   # native MQTT (gateways; in-network clients use the service name)
      - "${MOSQUITTO_WS_PORT:-9001}:9001"     # MQTT over websockets (Leftenant join monitor, browser-side)
    volumes:
      - ./mosquitto:/mosquitto/config/:ro

  chirpstack:
    image: chirpstack/chirpstack:4
    restart: unless-stopped
    command: -c /etc/chirpstack
    volumes:
      - ./chirpstack:/etc/chirpstack:ro
    environment:
      POSTGRESQL_HOST: chirpstack-postgres
      REDIS_HOST: redis
      MQTT_BROKER_HOST: mosquitto
      API_SECRET: ${CHIRPSTACK_API_SECRET:-change-me-please}
      # Active region/sub-band. Expands into enabled_regions in chirpstack.toml and
      # must match the gateway bridges' topic prefix (both use REGION). Default us915_0.
      REGION: ${REGION:-us915_0}
      # PostgreSQL integration target — ChirpStack writes every device event into
      # this standalone DB and auto-creates the event_* tables there on first boot.
      # These expand into the [integration.postgresql] dsn in chirpstack/chirpstack.toml.
      EVENTS_POSTGRESQL_HOST: events-postgres
      EVENTS_POSTGRESQL_USER: ${EVENTS_POSTGRES_USER:-events}
      EVENTS_POSTGRESQL_PASSWORD: ${EVENTS_POSTGRES_PASSWORD:-changeme}
      EVENTS_POSTGRESQL_DB: ${EVENTS_POSTGRES_DB:-chirpstack_events}
    ports:
      - "${CHIRPSTACK_HOST_PORT:-8080}:8080"   # admin UI + gRPC
    depends_on:
      chirpstack-postgres:
        condition: service_healthy
      events-postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
      redis:
        condition: service_started

  chirpstack-rest-api:
    image: chirpstack/chirpstack-rest-api:4
    restart: unless-stopped
    # --cors must match the browser origin Leftenant is served from. Override
    # LEFTENANT_ORIGIN in .env when reaching the bench by LAN IP instead of localhost.
    command: --server chirpstack:8080 --bind 0.0.0.0:8090 --insecure --cors ${LEFTENANT_ORIGIN:-http://localhost:4173}
    ports:
      - "${CHIRPSTACK_REST_HOST_PORT:-8090}:8090"
    depends_on:
      - chirpstack

  # Semtech UDP packet-forwarder gateways (legacy protocol, UDP :1700).
  # The MQTT topic prefix is the REGION flag (default us915_0 — see .env), and must
  # match ChirpStack's enabled region. Flip REGION to us915_1 (or any band whose
  # region file is present) to change sub-band. Caveat: that holds for real
  # gateways. The bundled mock-sensors harness only knows the US915 channel plans
  # and throws on any other REGION, so a non-US915 band means no mock data.
  chirpstack-gateway-bridge:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    ports:
      - "${GATEWAY_BRIDGE_UDP_PORT:-1700}:1700/udp"   # Semtech UDP packet forwarder
    volumes:
      - ./gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  # BasicStation gateways (LNS WebSocket, TCP :3001). Same REGION topic prefix as the
  # UDP bridge, so ChirpStack handles both. Point the gateway's LNS/tc URI at
  # ws://<this-host-ip>:3001. The REGION flag also selects the channel-plan file
  # (chirpstack-gateway-bridge-basicstation-${REGION}.toml) — us915_0 and us915_1
  # ship with the stack; add gateway-bridge/…-<band>.toml for other bands.
  chirpstack-gateway-bridge-basicstation:
    image: chirpstack/chirpstack-gateway-bridge:4
    restart: unless-stopped
    command: -c /etc/chirpstack-gateway-bridge/chirpstack-gateway-bridge-basicstation-${REGION:-us915_0}.toml
    ports:
      - "${GATEWAY_BRIDGE_BASICSTATION_PORT:-3001}:3001"   # BasicStation LNS WebSocket
    volumes:
      - ./gateway-bridge:/etc/chirpstack-gateway-bridge:ro
    environment:
      INTEGRATION__MQTT__EVENT_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/event/{{ .EventType }}
      INTEGRATION__MQTT__STATE_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/state/{{ .StateType }}
      INTEGRATION__MQTT__COMMAND_TOPIC_TEMPLATE: ${REGION:-us915_0}/gateway/{{ .GatewayID }}/command/#
    depends_on:
      - mosquitto

  # ── Provisioner (one-shot) ──────────────────────────────────────────────────
  provisioner:
    build: ./provisioning
    restart: "no"
    environment:
      # Provisioning (login, tenant, api-key) goes over gRPC — the REST gateway
      # does not expose InternalService/ApiKeyService.
      CHIRPSTACK_GRPC: chirpstack:8080
      # REST endpoint passed to attach-codecs.py (codec attach uses REST).
      CHIRPSTACK_REST_URL: http://chirpstack-rest-api:8090
      CHIRPSTACK_ADMIN_EMAIL: ${CHIRPSTACK_ADMIN_EMAIL:-admin}
      CHIRPSTACK_ADMIN_PASSWORD: ${CHIRPSTACK_ADMIN_PASSWORD:-admin}
      TENANT_NAME: ${TENANT_NAME:-Intelligent Farming}
      API_KEY_NAME: ${API_KEY_NAME:-intelligent-farming-stack}
      # Browser-facing URLs written into Leftenant's config.json. Change these
      # (and LEFTENANT_ORIGIN above) when the bench is reached by LAN IP.
      LEFTENANT_CHIRPSTACK_URL: ${LEFTENANT_CHIRPSTACK_URL:-http://localhost:8090}
      LEFTENANT_MQTT_URL: ${LEFTENANT_MQTT_URL:-ws://localhost:9001}
      # Host a physical gateway forwards to (Gateway Bridge, published at :1700 /
      # :3001). setup.sh auto-detects the host LAN IP into this; if unset the
      # provisioner falls back to the LEFTENANT_CHIRPSTACK_URL host.
      LEFTENANT_GATEWAY_BRIDGE_HOST: ${LEFTENANT_GATEWAY_BRIDGE_HOST:-}
    volumes:
      - shared:/shared
      # Best-effort codec attach: if codec .js files are present at CODECS_DIR,
      # attach-codecs.py runs against the new tenant key. Optional and orthogonal
      # to the event store — a missing/empty dir just makes this a no-op. Defaults
      # to the git-ignored Makerfabs codecs if that repo happens to be cloned
      # alongside; point CODECS_DIR at any local folder to decouple entirely.
      - ${CODECS_DIR:-./codecs}:/codecs:ro
    depends_on:
      - chirpstack            # gRPC provisioning target
      - chirpstack-rest-api   # used by the best-effort codec attach

  # ── Leftenant (pre-configured provisioning UI) ──────────────────────────────
  leftenant:
    # Runs an image built from the public repo's latest main. We intentionally do
    # NOT use compose's `build:` git-URL support: compose mis-resolves a remote git
    # context as a local path on Windows (docker/compose#13815 — "filename, directory
    # name, or volume label syntax is incorrect"). Instead the setup scripts and the
    # one-line installer build this tag with `docker build <giturl>` (the buildx CLI
    # clones the repo server-side, which works on every platform). Build it with:
    #   docker build -t intelligent-farming-stack/leftenant:local https://github.com/intelligent-farming/leftenant.git#main
    image: ${LEFTENANT_IMAGE:-intelligent-farming-stack/leftenant:local}
    restart: unless-stopped
    ports:
      - "${LEFTENANT_HOST_PORT:-4173}:80"
    volumes:
      - shared:/shared:ro   # entrypoint reads /shared/config.json written by the provisioner
    depends_on:
      provisioner:
        condition: service_completed_successfully

  # ── Standalone device-event store (ChirpStack PostgreSQL integration target) ──
  events-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # wal_level is `replica` by default. Set EVENTS_POSTGRES_WAL_LEVEL=logical (see
    # .env) to enable log-based CDC for Fivetran, then recreate this container:
    # `docker compose up -d events-postgres`. The slot/sender counts below are the
    # PG16 defaults, surfaced so one Fivetran slot fits without extra tuning.
    command:
      - "postgres"
      - "-c"
      - "wal_level=${EVENTS_POSTGRES_WAL_LEVEL:-replica}"
      - "-c"
      - "max_wal_senders=${EVENTS_POSTGRES_MAX_WAL_SENDERS:-10}"
      - "-c"
      - "max_replication_slots=${EVENTS_POSTGRES_MAX_REPLICATION_SLOTS:-10}"
    environment:
      # ChirpStack connects as this owner role and auto-creates the event_* tables.
      POSTGRES_USER: ${EVENTS_POSTGRES_USER:-events}
      POSTGRES_PASSWORD: ${EVENTS_POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${EVENTS_POSTGRES_DB:-chirpstack_events}
      # Read-only role PostGraphile connects as (created by initdb 010_events_roles.sh).
      POSTGRES_API_USER: ${EVENTS_POSTGRES_API_USER:-events_api}
      POSTGRES_API_PASSWORD: ${EVENTS_POSTGRES_API_PASSWORD:-changeme-api}
      # Engine role Leadsman connects as (created by initdb 020_leadsman_role.sh):
      # SELECT on public, INSERT/UPDATE on the leadsman schema. No DDL, no DELETE.
      POSTGRES_LEADSMAN_USER: ${POSTGRES_LEADSMAN_USER:-leadsman}
      POSTGRES_LEADSMAN_PASSWORD: ${POSTGRES_LEADSMAN_PASSWORD:-changeme-leadsman}
      # Opt-in read-only replication role for Fivetran; the same init script creates
      # it (+ publication) only when both are set (blank = disabled).
      POSTGRES_FIVETRAN_USER: ${EVENTS_POSTGRES_FIVETRAN_USER:-}
      POSTGRES_FIVETRAN_PASSWORD: ${EVENTS_POSTGRES_FIVETRAN_PASSWORD:-}
      POSTGRES_FIVETRAN_PUBLICATION: ${EVENTS_POSTGRES_FIVETRAN_PUBLICATION:-fivetran_pub}
    volumes:
      - eventsdata:/var/lib/postgresql/data
      - ./postgresql/events-initdb:/docker-entrypoint-initdb.d:ro
    ports:
      # Loopback-only by default. Flip EVENTS_POSTGRES_HOST_BIND to 0.0.0.0 (or a
      # specific LAN/VPN address) to let an off-device consumer like Fivetran
      # reach Postgres. Expose beyond the device only over TLS + a firewall
      # scoped to the consumer's source IPs, using the read-only events_api role.
      - "${EVENTS_POSTGRES_HOST_BIND:-127.0.0.1}:${EVENTS_POSTGRES_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      # Without start_period, probe failures during startup count against `retries`, so the
      # whole budget is 12 x 5s = 60s. That is fine for a first boot on a laptop, but this
      # store grows and lives on slow edge hardware: after an unclean stop Postgres replays
      # WAL before accepting connections, and on a 2-core box with a large data directory
      # that can take longer than a minute. Exceeding it makes every dependent service abort
      # with "container events-postgres is unhealthy" — which reads as a broken database
      # rather than an impatient healthcheck. Probes during start_period do not count.
      start_period: 120s

  # One-shot: block until ChirpStack has created its event_up table, so events-api
  # introspects a populated schema on first boot (matches the provisioner idiom).
  events-schema-wait:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: events-postgres
      PGUSER: ${EVENTS_POSTGRES_USER:-events}
      PGPASSWORD: ${EVENTS_POSTGRES_PASSWORD:-changeme}
      PGDATABASE: ${EVENTS_POSTGRES_DB:-chirpstack_events}
    entrypoint:
      - "bash"
      - "-c"
      - |
        echo "waiting for ChirpStack to create public.event_up ..."
        until [ "$$(psql -tAc "SELECT to_regclass('public.event_up') IS NOT NULL")" = "t" ]; do
          sleep 2
        done
        echo "event_up exists — schema ready"
    depends_on:
      events-postgres:
        condition: service_healthy
      chirpstack:
        condition: service_started

  # ── Read-only GraphQL/GraphiQL over the event store ───────────────────────────
  events-api:
    build: ./events-api
    restart: unless-stopped
    environment:
      # Connects as the read-only events_api role; creds via env (not CLI args) so
      # they don't show up in the container's process list.
      DATABASE_URL: postgres://${EVENTS_POSTGRES_API_USER:-events_api}:${EVENTS_POSTGRES_API_PASSWORD:-changeme-api}@events-postgres:5432/${EVENTS_POSTGRES_DB:-chirpstack_events}
      API_GRAPHIQL: ${EVENTS_API_GRAPHIQL:-true}
      # Schemas exposed over GraphQL. `leadsman` puts the rule engine's open alerts on
      # the same endpoint as the telemetry. Set `public` alone if you remove Leadsman.
      API_SCHEMAS: ${EVENTS_API_SCHEMAS:-public,leadsman}
    ports:
      # host 5050 by default: port 5000 is taken by the macOS AirPlay Receiver.
      - "${EVENTS_API_HOST_BIND:-127.0.0.1}:${EVENTS_API_HOST_PORT:-5050}:5000"
    depends_on:
      events-postgres:
        condition: service_healthy
      events-schema-wait:
        condition: service_completed_successfully
      # PostGraphile will not start against a schema that does not exist yet, so the
      # leadsman schema has to be created before this service boots. Drop this entry
      # (and set EVENTS_API_SCHEMAS=public) if you remove the Leadsman services.
      leadsman-migrate:
        condition: service_completed_successfully

  # ── Leadsman (scheduled rule engine over the event store) ─────────────────────
  # Deterministic monitoring: reads the ChirpStack event_* tables on a cron and writes
  # alerts to the `leadsman` schema in the same database. Zero LLM tokens — an agent
  # (Hermes, or anything else) subscribes to the alerts rather than polling telemetry.
  # Nothing is published to the host; the alert surface is reached over the existing
  # read-only GraphQL at :5050, or by delivery to notify.destinations.

  # One-shot: create the `leadsman` schema (and, by default, index the event_* tables)
  # before the engine starts. Runs as the OWNER role — DDL is deliberately outside the
  # engine role's rights, so the long-running container cannot alter any schema.
  leadsman-migrate:
    image: ${LEADSMAN_IMAGE:-ghcr.io/intelligent-farming/leadsman:0.2}
    restart: "no"
    command: ["migrate"]
    environment:
      LEADSMAN_MIGRATE_URL: postgres://${EVENTS_POSTGRES_USER:-events}:${EVENTS_POSTGRES_PASSWORD:-changeme}@events-postgres:5432/${EVENTS_POSTGRES_DB:-chirpstack_events}
      # ChirpStack ships event_* with a primary-key index only, and every check filters
      # by time and groups by dev_eui — unindexed, each sounding is a sequential scan,
      # which is how a monitor starts degrading the thing it monitors. On by default
      # because this stack owns events-postgres outright; the tables are empty on a
      # fresh volume so the CREATE INDEXes are instant. Set false to skip them.
      LEADSMAN_APPLY_EVENT_INDEXES: ${LEADSMAN_APPLY_EVENT_INDEXES:-true}
      LEADSMAN_LOG_FORMAT: ${LEADSMAN_LOG_FORMAT:-text}
    depends_on:
      events-postgres:
        condition: service_healthy
      # The index migration touches event_up, so wait for ChirpStack to have created it.
      events-schema-wait:
        condition: service_completed_successfully

  leadsman:
    image: ${LEADSMAN_IMAGE:-ghcr.io/intelligent-farming/leadsman:0.2}
    restart: unless-stopped
    environment:
      # Engine role: SELECT on public (read ChirpStack events), INSERT/UPDATE on the
      # leadsman schema (write its own alerts). It cannot alter ChirpStack's data.
      LEADSMAN_DATABASE_URL: postgres://${POSTGRES_LEADSMAN_USER:-leadsman}:${POSTGRES_LEADSMAN_PASSWORD:-changeme-leadsman}@events-postgres:5432/${EVENTS_POSTGRES_DB:-chirpstack_events}
      LEADSMAN_CONFIG: /etc/leadsman/leadsman.json
      LEADSMAN_LOG_LEVEL: ${LEADSMAN_LOG_LEVEL:-info}
      LEADSMAN_LOG_FORMAT: ${LEADSMAN_LOG_FORMAT:-json}
      # Shared-secret fallback for webhook destinations that have no token of their own.
      # Which destinations exist and where each points is set in leadsman.json; per-destination
      # overrides are LEADSMAN_DEST_<NAME>_* — pass any you use through here.
      LEADSMAN_WEBHOOK_TOKEN: ${LEADSMAN_WEBHOOK_TOKEN:-}
      # Per-destination overrides. Compose only forwards variables it NAMES, so a
      # LEADSMAN_DEST_<NAME>_* in .env is silently dropped unless it is listed here. These
      # cover the destination names the shipped configs use (`oncall`, `sms`, `agent`); if you
      # name a destination something else, add its four lines below or the override will look
      # set in .env and have no effect.
      LEADSMAN_DEST_ONCALL_PROVIDER: ${LEADSMAN_DEST_ONCALL_PROVIDER:-}
      LEADSMAN_DEST_ONCALL_TO: ${LEADSMAN_DEST_ONCALL_TO:-}
      LEADSMAN_DEST_ONCALL_CHAT_ID: ${LEADSMAN_DEST_ONCALL_CHAT_ID:-}
      LEADSMAN_DEST_ONCALL_WEBHOOK_URL: ${LEADSMAN_DEST_ONCALL_WEBHOOK_URL:-}
      LEADSMAN_DEST_SMS_PROVIDER: ${LEADSMAN_DEST_SMS_PROVIDER:-}
      LEADSMAN_DEST_SMS_TO: ${LEADSMAN_DEST_SMS_TO:-}
      LEADSMAN_DEST_SMS_CHAT_ID: ${LEADSMAN_DEST_SMS_CHAT_ID:-}
      LEADSMAN_DEST_SMS_WEBHOOK_URL: ${LEADSMAN_DEST_SMS_WEBHOOK_URL:-}
      LEADSMAN_DEST_AGENT_WEBHOOK_URL: ${LEADSMAN_DEST_AGENT_WEBHOOK_URL:-}
      LEADSMAN_WEBHOOK_TOKEN_AGENT: ${LEADSMAN_WEBHOOK_TOKEN_AGENT:-}
      LEADSMAN_WEBHOOK_TOKEN_SMS: ${LEADSMAN_WEBHOOK_TOKEN_SMS:-}
      # Outbound messaging credentials. Blank = that provider is
      # unavailable; a destination configured to use it then fails config validation at
      # startup rather than silently never delivering. See .env.example.
      LEADSMAN_TWILIO_ACCOUNT_SID: ${LEADSMAN_TWILIO_ACCOUNT_SID:-}
      LEADSMAN_TWILIO_API_KEY_SID: ${LEADSMAN_TWILIO_API_KEY_SID:-}
      LEADSMAN_TWILIO_API_KEY_SECRET: ${LEADSMAN_TWILIO_API_KEY_SECRET:-}
      LEADSMAN_TWILIO_FROM: ${LEADSMAN_TWILIO_FROM:-}
      LEADSMAN_TELEGRAM_BOT_TOKEN: ${LEADSMAN_TELEGRAM_BOT_TOKEN:-}
      LEADSMAN_SIGNAL_BASE_URL: ${LEADSMAN_SIGNAL_BASE_URL:-}
      LEADSMAN_SIGNAL_FROM: ${LEADSMAN_SIGNAL_FROM:-}
    volumes:
      # Read-only: the engine never writes its config. ./leadsman/leadsman.json is
      # created from leadsman.example.json by the setup scripts and is git-ignored, so
      # your check selection survives an update. Edit it and
      # `docker compose restart leadsman` to change which checks run.
      - ./leadsman:/etc/leadsman:ro
    depends_on:
      events-postgres:
        condition: service_healthy
      leadsman-migrate:
        condition: service_completed_successfully
    # Resource ceiling. On a 2-core edge device the engine must not crowd out
    # ChirpStack's ingestion; soundings are not latency-critical. `deploy.resources`
    # is honoured by `docker compose up` (non-swarm) as of Compose v2.
    deploy:
      resources:
        limits:
          cpus: "${LEADSMAN_CPUS:-0.50}"
          memory: ${LEADSMAN_MEMORY:-256M}

  # ── Signal relay (opt-in) ─────────────────────────────────────────────────────
  # Signal has no hosted send API, so sending requires signal-cli. This wraps it in an HTTP
  # service Leadsman can POST to. Behind a compose profile, so a plain `up` never starts it:
  #
  #   docker compose --profile signal up -d signal-cli
  #
  # One-time registration, which cannot be automated — Signal requires a captcha and an SMS
  # code against a real number you control (a landline or VoIP number usually will not work):
  #   1. open https://signalcaptchas.org/registration/generate.html and solve it
  #   2. copy the signalcaptcha:// link it produces
  #   3. docker compose exec signal-cli signal-cli -a +1512... register --captcha <link>
  #   4. docker compose exec signal-cli signal-cli -a +1512... verify <6-digit code>
  # Then set LEADSMAN_SIGNAL_BASE_URL=http://signal-cli:8080 and LEADSMAN_SIGNAL_FROM=+1512…
  #
  # To message a group rather than individuals, list its id in the destination's `to` array —
  # signal-cli reports group ids as `group.<base64>`:
  #   docker compose exec signal-cli signal-cli -a +1512... listGroups
  signal-cli:
    image: bbernhard/signal-cli-rest-api:latest
    profiles: ["signal"]
    restart: unless-stopped
    environment:
      # json-rpc keeps signal-cli resident instead of spawning a JVM per request, which on a
      # 2-core edge device is the difference between a fast send and a multi-second one.
      MODE: json-rpc
    volumes:
      - signalcli:/home/.local/share/signal-cli
    # Not published: only Leadsman needs to reach it, over the compose network. Publish it
    # only for the registration steps above if you prefer curl to `exec`.

  # ── Mock sensors (demo data generator; opt-in via the `mock` profile) ─────────
  # Simulates a handful of real ag sensors: builds valid LoRaWAN uplinks (MIC +
  # encrypted payload) and pushes them to the gateway bridge over Semtech UDP,
  # exactly like a real gateway — so mocked readings flow through ChirpStack's
  # decode into event_up and the MQTT app stream. Never runs by default; start it
  # with `docker compose --profile mock up -d mock-sensors`. It reads the tenant
  # API key from the shared volume (like Leftenant) and provisions its own
  # gateway/app/profiles/devices (idempotent) before emitting.
  #
  # BUILD PREREQUISITE (temporary): run `npm --prefix mock-sensors run pack-codec`
  # on the host before building this service. Its codec dependency is a tarball
  # under mock-sensors/vendor/ (lorawan-codec-normalization 0.2.0 is not on npm
  # yet), and the build context here is ./mock-sensors — Docker cannot reach the
  # sibling codec checkout, so the tarball has to exist before `docker compose
  # build`. `npm --prefix mock-sensors run mock:up` does both steps.
  #
  # The harness is US915-only: it derives uplink RF params for us915_0/us915_1 and
  # throws on any other REGION (see mock-sensors/README.md "RF parameters").
  mock-sensors:
    build: ./mock-sensors
    profiles: ["mock"]
    restart: unless-stopped
    environment:
      CHIRPSTACK_REST_URL: http://chirpstack-rest-api:8090
      # The harness's Semtech-UDP *target*. Deliberately not GATEWAY_BRIDGE_UDP_*:
      # at the repo root that name is the published host port mapping
      # ("${GATEWAY_BRIDGE_UDP_PORT}:1700/udp"), and on this compose network the
      # target is always the container port 1700 regardless of that mapping.
      MOCK_UDP_HOST: chirpstack-gateway-bridge
      MOCK_UDP_PORT: "1700"
      REGION: ${REGION:-us915_0}
      MOCK_INTERVAL_SECONDS: ${MOCK_INTERVAL_SECONDS:-15}
      MOCK_GATEWAY_EUI: ${MOCK_GATEWAY_EUI:-da7a9a7e00000001}
    volumes:
      - shared:/shared:ro   # reads /shared/config.json (tenant API key + id)
    command: ["run"]
    depends_on:
      provisioner:
        condition: service_completed_successfully
      chirpstack:
        condition: service_started
      # All of the harness's own provisioning (gateway, app, profiles, devices)
      # goes through the REST gateway. Without this it only arrived transitively
      # via provisioner — whose REST work is conditional on CODECS_DIR — so a cold
      # `--profile mock up` could hit ECONNREFUSED and crash-loop under
      # `restart: unless-stopped` until the gateway happened to be listening.
      chirpstack-rest-api:
        condition: service_started
      chirpstack-gateway-bridge:
        condition: service_started

volumes:
  chirpstack-pgdata:
  redisdata:
  eventsdata:
  shared:
  # Signal's registered identity and session state. Losing it means re-registering.
  signalcli:
